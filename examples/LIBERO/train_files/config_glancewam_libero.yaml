# SkyReelsV2-GR00T **GOAL-IMAGE co-training** on LIBERO 4-in-1, lerobot v3 data.
# The low level of the goal-image planner — LIBERO
# sibling of examples/Robocasa_kitchen/train_files/config_glancewam_robocasa_kitchen.yaml.
#
# Clone of config_cotrain_baseline_libero.yaml (the 0628 LIBERO cotrain champion's
# recipe) with the goal-image delta. Trained from the raw SkyReels-V2 DF checkpoint on the
# full demo set; eval is the standard 4-suite closed loop (the video DiT self-generates the
# goal — see GlanceWAM).
#
# What changes vs the plain LIBERO cotrain (everything else matches the champion):
#   - framework.name -> GlanceWAM
#   - framework.goal_conditioning added (the delta).
#   - The window ships a SECOND future frame: the video branch trains at the FIXED horizon
#     future_frame_idx (H_g, the goal-generation horizon), while the action head conditions
#     on a hindsight GOAL frame drawn per sample at g ~ U(0, H_g] (goal_frame_range), the
#     distribution it faces mid-cycle at inference (the plan's cadence rule).
#   - future_frame_idx moves 8 -> 48: the video target IS the goal-generation horizon here,
#     so it must sit at H_g, not at the champion's 0.4 s video-loss slot. This is the one
#     unavoidable recipe change beyond adding the goal.
#
# HORIZON (Q1, a knob): native is 20 Hz, so H_g = 2.4 s -> 48 native rows (the plan's minimum
# goal horizon). LIBERO episodes are SHORT (median 105 frames), so H_g=48 is already 46% of a
# median episode and a measured 39% of windows clamp their t+48 frame to the episode's last
# frame (see config_cotrain_baseline_libero.yaml's sizing caveat). For the GOAL frame a
# last-frame clamp is a legitimate hindsight end-state goal; for the VIDEO target it wastes
# some supervision — the reason NOT to push H_g to the kitchen's 60. action_horizon stays 8
# (0.4 s chunks, the champion's).
#
# CAMERA LAYOUT (LIBERO): two cameras (primary + wrist) stitched side-by-side into one wide
# 224x448 frame (camera_concat=side_by_side), so vae_input_size=[224,448]. STATELESS (the
# champion recipe sends no proprio).
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    lerobot_version: v3.0
    data_root_dir: results/Datasets
    data_mix: libero_all
    image_size:
    - 224
    - 224
    per_device_batch_size: 16
    num_workers: 16
    video_backend: torchcodec
    action_horizon: ${framework.action_model.action_horizon}
    num_history_frames: ${framework.world_model.num_history_frames}
    # The video-target future frame the DiT predicts (H_g, the goal-generation horizon),
    # at t+future_frame_idx NATIVE rows (LIBERO is 20 Hz -> 48 = 2.4 s). The launcher may
    # override.
    future_frame_idx: 48
    # Goal-image cotrain: a SECOND future frame — the hindsight goal the action head
    # conditions on, drawn per sample at g ~ U{1..48} native rows ((0, H_g], the cadence
    # rule). Appended after the future slot; needs future_frame_idx > 0; incompatible with
    # the VAE cache (co-training live-decodes anyway).
    goal_frame_range:
    - 1
    - 48
    camera_concat: ${framework.world_model.camera_concat}
    t5_cache:
      enabled: false
framework:
  name: GlanceWAM
  world_model:
    base_wm: Skywork/SkyReels-V2-DF-1.3B-540P-Diffusers
    num_history_frames: 1
    # side_by_side: stitch primary|wrist into one wide 224x448 frame.
    camera_concat: side_by_side
    vae_input_size: [224, 448]
    extract_layers:
    - -1
    combine_layers: concat_tokens
    truncate_at_extract: false
    skip_vae: false
    skip_text_encoder: false
    fps: 24
    text_max_length: 512
  video_cotrain:
    enabled: true
    lambda: 1.0
    sigma_sampling: uniform
    clean_prefix_isolation: true
  goal_conditioning:
    enabled: true
    # Per-sample probability of zeroing the goal tokens fed to the action head (keeps a
    # no-goal fallback in-distribution for the eval control arm).
    dropout_p: 0.1
    # Video-DiT flow-matching sampler steps used to GENERATE the goal latent at inference
    # (predict_action). Eval-only; higher = better goal, slower refresh.
    goal_gen_steps: 10
    # Sinusoidal embedding width for the goal-time diff g (native rows between the goal
    # frame and the current obs) added to the goal tokens, so the action head knows HOW FAR
    # AHEAD the goal is (trains on g ~ U(0,H_g]; at inference g shrinks within each refresh
    # cycle). 0 disables the diff conditioning.
    h_embed_dim: 16
  action_model:
    action_model_type: DiT-B
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    add_pos_embed: true
    diffusion_model_cfg:
      cross_attention_dim: 1536
      num_layers: 16
      output_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
    max_seq_len: 1024
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    num_timestep_buckets: 1000
    repeated_diffusion_steps: 8
run_id: libero_4in1_GlanceWAM
run_root_dir: ./results/Checkpoints
wandb_dir: ./results/wandb_local
seed: 42
trainer:
  ema:
    enabled: false
    decay: 0.999
    warmup: true
    start_step: 0
    device: cuda
  eval_interval: 1000
  freeze_modules: ''
  gradient_clipping: 1.0
  is_resume: false
  learning_rate:
    action_model: 0.0001
    base: 1.0e-05
  logging_frequency: 100
  lr_scheduler_type: cosine_with_min_lr
  max_train_steps: 80000
  scheduler_total_steps: 100000
  num_warmup_steps: 5000
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_interval: 10000
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
wandb_entity: linhan2-virginia-tech
wandb_project: GlanceWAM_LIBERO
