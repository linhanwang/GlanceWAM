[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_glancewam"
version = "0.1.0"
description = "GlanceWAM policy plugin for LeRobot (inference: LIBERO eval and real-robot rollouts with async goals + RTC)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# LeRobot itself is not listed: install it from source first (see README).
dependencies = [
    "diffusers>=0.38.0,<0.40.0",
    "transformers>=5.4.0,<5.6.0",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["lerobot_policy_glancewam*"]
